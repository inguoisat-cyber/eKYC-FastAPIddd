<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xác minh danh tính eKYC</title>
<style>
:root{--pri:#0b66e4;--ok:#1a8f3c;--err:#d32f2f;--bd:#dde2ea;--mut:#5b6573}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;justify-content:center;padding:16px;background:#f3f5f8;color:#1c2330;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:520px;align-self:flex-start;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px #0001}
h1{font-size:1.25rem;margin:0}h2{font-size:1.1rem;margin:0 0 6px}
.steps{display:flex;gap:6px;margin:12px 0 18px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--bd)}.steps i.on{background:var(--pri)}
.muted{color:var(--mut);margin:4px 0 12px}.err{color:var(--err)}.ok{color:var(--ok)}
button{font:inherit;font-weight:600;padding:11px 18px;border:0;border-radius:10px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:#e9eef6;color:#1c2330}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;width:100%}
.cam video{width:100%;height:100%;display:block}
.guide{position:absolute;left:50%;top:50%;width:82%;aspect-ratio:1.586;transform:translate(-50%,-50%);
  border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px #0007;pointer-events:none}
.oval{position:absolute;left:50%;top:50%;width:58%;height:78%;transform:translate(-50%,-50%);
  border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 999px #0007;pointer-events:none;transition:border-color .2s}
.tip{position:absolute;left:8px;right:8px;bottom:8px;padding:6px 12px;border-radius:20px;background:#000b;color:#fff;
  text-align:center;font-weight:600}
.spin{width:36px;height:36px;margin:20px auto;border:4px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.box{border-radius:10px;padding:14px;margin-top:12px}.box.ok{background:#e8f5e9;border:1px solid #81c784}.box.err{background:#ffebee;border:1px solid #ef9a9a}
.box p{margin:4px 0}
</style>
</head>
<body>
<main>
  <h1>Xác minh danh tính (eKYC)</h1>
  <div class="steps" id="bar"><i></i><i></i><i></i><i></i></div>
  <div id="app"><noscript>Cần bật JavaScript để sử dụng.</noscript></div>
</main>
<script src="/app.js"></script>
</body>
</html>
