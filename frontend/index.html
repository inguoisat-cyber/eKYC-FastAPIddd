<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eKYC System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .step {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .status {
            font-weight: bold;
            color: #0066cc;
        }

        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0052a3;
        }

        .camera-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .camera-container video {
            width: 100%;
            display: block;
        }

        .oval-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 70%;
            border: 4px dashed #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }
        
        .overlay-instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            z-index: 11;
            text-align: center;
            width: 90%;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Xác minh danh tính (eKYC)</h1>
        <p>Chào mừng bạn đến với hệ thống xác minh danh tính.</p>

        <div id="app">
            <div class="step" id="step-init">
                <h3>Khởi tạo phiên làm việc</h3>
                <p>Trạng thái: <span class="status">Đang chờ</span></p>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>

</html>
