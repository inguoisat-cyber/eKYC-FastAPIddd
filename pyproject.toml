[project]
name = "ekyc"
version = "1.0.0"
description = "Hệ thống eKYC: đọc QR CCCD, so khớp khuôn mặt, kiểm tra liveness"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "cryptography>=42",
    "insightface>=0.7.3",   # kéo theo numpy, onnxruntime, opencv-python, scikit-image
    "pyzbar>=0.1.9",        # cần thêm thư viện hệ thống libzbar0 trên Linux (không có thì tự dùng OpenCV)
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]     # chỉ cần khi bật OCR_FALLBACK=true (kéo theo torch, rất nặng)
dev = ["pytest>=8", "httpx", "qrcode"]

[tool.setuptools]
py-modules = []            # đây là ứng dụng, không phải thư viện: chỉ dùng file này để khai báo dependency

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
