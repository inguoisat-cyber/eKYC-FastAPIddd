[project]
name = "ekyc-ai"
version = "0.1.0"
description = "Hệ thống eKYC hoàn chỉnh phục vụ đồ án học thuật"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.4",
    "onnxruntime>=1.17.1",
    "pyzbar>=0.1.9",
    "insightface>=0.7.3",
    "mediapipe>=0.10.11",
    "cryptography>=42.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.3.5",
    "black>=24.3.0",
]

[tool.setuptools]
packages = ["backend.app"]
